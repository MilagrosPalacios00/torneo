<body>
<div id="app"></div>
<div id="modal-root"></div>
<script>
(function(){
'use strict';
var KEY='torneoDobles.v1', HKEY='torneoDobles.hist.v1';
var TEAMS={azul:{name:'Azul',color:'#2D7FF9',emoji:'🔵'},verde:{name:'Verde',color:'#1DB954',emoji:'🟢'},naranja:{name:'Naranja',color:'#FF8A1F',emoji:'🟠'}};
var TEAM_IDS=['azul','verde','naranja'];
var CARDS={
  doble:{name:'Doble',type:'oculta',icon:'✖️2',color:'#F5B700',desc:'Los games de la pareja valen doble para el equipo.'},
  robo:{name:'Robo',type:'oculta',icon:'🦹',color:'#FF4D6D',desc:'Le sacás hasta 2 games al equipo rival (nunca más de los que hizo). Anula su Doble.'},
  escudo:{name:'Escudo',type:'oculta',icon:'🛡️',color:'#2D9CDB',desc:'Anula la carta oculta del rival en este partido.'},
  sinsegundo:{name:'Sin segundo saque',type:'abierta',icon:'🎯',color:'#22B573',desc:'Durante un game, la pareja rival tiene un solo saque.'},
  mano:{name:'Mano cambiada',type:'abierta',icon:'🤚',color:'#E94BC4',desc:'Durante un game, una rival elegida juega con la otra mano.'},
  turbo:{name:'Game turbo',type:'abierta',icon:'🚀',color:'#FF7A00',desc:'Si ganan ese game, vale por 2 en el marcador.'}
};
var HIDDEN=['doble','robo','escudo'], OPEN=['sinsegundo','mano','turbo'];
var CRUCES=[['azul','verde'],['azul','naranja'],['verde','azul'],['verde','naranja'],['naranja','azul'],['naranja','verde'],
            ['azul','verde'],['azul','naranja'],['verde','azul'],['verde','naranja'],['naranja','azul'],['naranja','verde']];
var MORNING_N=12, JF=4*60*1000, FORCE=false, WAIT=false;

function newState(){return {v:1,phase:'setup',players:[],settings:{cards:true,emergency:false,lesion:'4'},matches:[],seq:1,
  teams:null,leaders:null,arrastre:{},pickOrder:[],openPick:{},bombos:null,morningCut:false,afternoonCut:false,tb:{},sunday:null};}
function load(){try{var r=localStorage.getItem(KEY);if(r){var s=JSON.parse(r);if(s&&s.players)return s;}}catch(e){}return newState();}
function loadHist(){try{var r=localStorage.getItem(HKEY);if(r)return JSON.parse(r)||[];}catch(e){}return [];}
var S=load(), hist=loadHist(), TAB='canchas', RKV='sab', SETUP_DRAFT='';
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(HKEY,JSON.stringify(hist.slice(-30)));}catch(e){toast('⚠️ No se pudo guardar en el teléfono');}}
function commit(fn){hist.push(JSON.stringify(S));if(hist.length>30)hist.shift();fn();persist();render();}
function tryCommit(fn){var snap=JSON.stringify(S);var ok=fn();if(ok){hist.push(snap);if(hist.length>30)hist.shift();persist();}else{S=JSON.parse(snap);}render();return ok;}
function undo(){if(!hist.length)return toast('No hay nada para deshacer');ask('↩️ Deshacer','¿Deshacer la última acción?','Sí, deshacer','y',function(){S=JSON.parse(hist.pop());persist();render();toast('↩️ Listo, deshecho');});}

// ---------- helpers
function $(q){return document.querySelector(q);}
function now(){return (window.__NOW!=null)?window.__NOW:Date.now();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function P(id){for(var i=0;i<S.players.length;i++)if(S.players[i].id===id)return S.players[i];return null;}
function nm(id){var p=P(id);return p?p.name:'?';}
function getM(id){id=+id;for(var i=0;i<S.matches.length;i++)if(S.matches[i].id===id)return S.matches[i];return null;}
function live(){return S.matches.filter(function(m){return !m.done&&!m.x;});}
function onCourt(){var s=new Set();live().forEach(function(m){m.a.concat(m.b).forEach(function(id){s.add(id);});});return s;}
function courtMatch(c){return live().filter(function(m){return m.court===c;})[0]||null;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(n){n=Math.round(n*10)/10;return String(n).replace('.',',');}
function fmt2(n){return (Math.round(n*100)/100).toFixed(2).replace('.',',');}
function teamOf(pid){if(!S.teams)return null;for(var i=0;i<3;i++){if(S.teams[TEAM_IDS[i]].indexOf(pid)>=0)return TEAM_IDS[i];}return null;}
function has(m,pid){return m.a.indexOf(pid)>=0||m.b.indexOf(pid)>=0;}
function countPJ(pid,phs){return S.matches.filter(function(m){return !m.x&&phs.indexOf(m.ph)>=0&&has(m,pid);}).length;}
function countCreated(ph){return S.matches.filter(function(m){return m.ph===ph&&!m.x;}).length;}
function lastEnd(pid){var t=0;S.matches.forEach(function(m){if(m.done&&!m.x&&has(m,pid))t=Math.max(t,m.t1||0);});return t;}
function jf(pid){var t=lastEnd(pid);return !!t&&(now()-t)<JF;}
function together(m,p,q){return (m.a.indexOf(p)>=0&&m.a.indexOf(q)>=0)||(m.b.indexOf(p)>=0&&m.b.indexOf(q)>=0);}
function against(m,p,q){return (m.a.indexOf(p)>=0&&m.b.indexOf(q)>=0)||(m.b.indexOf(p)>=0&&m.a.indexOf(q)>=0);}
function partnerCount(p,q){return S.matches.filter(function(m){return !m.x&&together(m,p,q);}).length;}
function oppCount(p,q){return S.matches.filter(function(m){return !m.x&&against(m,p,q);}).length;}
function target(){return S.settings.emergency?3:5;}
function mins(m){return Math.max(0,Math.floor((now()-m.t0)/60000));}
function prioritySort(ids,phs){
  return shuffle(ids).map(function(id){return {id:id,pj:countPJ(id,phs),jf:jf(id)?1:0,le:lastEnd(id)};})
    .sort(function(x,y){return x.pj-y.pj||x.jf-y.jf||x.le-y.le;}).map(function(o){return o.id;});
}
function bestSplit(f){
  var opts=shuffle([[[f[0],f[1]],[f[2],f[3]]],[[f[0],f[2]],[f[1],f[3]]],[[f[0],f[3]],[f[1],f[2]]]]);
  var best=null,bc=1e9;
  opts.forEach(function(o){var a=o[0],b=o[1];
    var c=partnerCount(a[0],a[1])*10+partnerCount(b[0],b[1])*10+oppCount(a[0],b[0])+oppCount(a[0],b[1])+oppCount(a[1],b[0])+oppCount(a[1],b[1]);
    if(c<bc){bc=c;best=o;}});
  return best;
}
function addMatch(o){
  var m={id:S.seq++,ph:o.ph,court:o.court,a:o.a,b:o.b,ta:o.ta||null,tb:o.tb||null,bor:o.bor||{a:null,b:null},
    target:o.target||5,done:false,x:false,sa:null,sb:null,partial:false,x2:[],hid:{a:null,b:null},opn:{a:null,b:null},t0:now(),t1:null};
  S.matches.push(m);return m;
}

// ---------- stats
function statMap(phs){
  var st={};S.players.forEach(function(p){st[p.id]={pj:0,g:0,pg:0,avg:0,x2:false};});
  S.matches.forEach(function(m){
    if(m.x||phs.indexOf(m.ph)<0||!m.done)return;
    ['a','b'].forEach(function(s){
      var gm=s==='a'?m.sa:m.sb, ot=s==='a'?m.sb:m.sa;
      m[s].forEach(function(id){var r=st[id];if(!r)return;var mult=(m.ph==='M'&&m.x2.indexOf(id)>=0)?2:1;
        if(mult===2)r.x2=true;r.pj++;r.g+=gm*mult;if(gm>ot)r.pg++;});
    });
  });
  Object.keys(st).forEach(function(k){var r=st[k];r.avg=r.pj?r.g/r.pj:0;});
  return st;
}
function ranking(phs){
  var st=statMap(phs);
  return S.players.map(function(p){var r=st[p.id];return {id:p.id,name:p.name,rnd:p.rnd,out:p.out,pj:r.pj,g:r.g,pg:r.pg,avg:r.avg,x2:r.x2};})
    .sort(function(a,b){return b.avg-a.avg||b.pg-a.pg||a.rnd-b.rnd;});
}
function satRanking(){
  var rk=ranking(['M','T']);
  if(S.tb.ind){var i=rk.findIndex(function(r){return r.id===S.tb.ind;});if(i>0){var c=rk.splice(i,1)[0];rk.unshift(c);}}
  return rk;
}
function teamCalc(m){
  var ra=m.sa||0, rb=m.sb||0, on=S.settings.cards;
  var ha=on?m.hid.a:null, hb=on?m.hid.b:null, ea=ha, eb=hb, notes=[];
  var TN=function(t){return TEAMS[t].name;};
  if(ha==='escudo'){ea=null;if(hb&&hb!=='escudo'){eb=null;notes.push('🛡️ El Escudo de '+TN(m.ta)+' anuló el '+CARDS[hb].name+' de '+TN(m.tb));}else notes.push('🛡️ El Escudo de '+TN(m.ta)+' no tuvo efecto');}
  if(hb==='escudo'){eb=null;if(ha&&ha!=='escudo'){ea=null;notes.push('🛡️ El Escudo de '+TN(m.tb)+' anuló el '+CARDS[ha].name+' de '+TN(m.ta));}else notes.push('🛡️ El Escudo de '+TN(m.tb)+' no tuvo efecto');}
  if(ea==='robo'&&eb==='doble'){eb=null;notes.push('🦹 El Robo de '+TN(m.ta)+' anuló el Doble de '+TN(m.tb));}
  if(eb==='robo'&&ea==='doble'){ea=null;notes.push('🦹 El Robo de '+TN(m.tb)+' anuló el Doble de '+TN(m.ta));}
  var A=ra*(ea==='doble'?2:1), B=rb*(eb==='doble'?2:1);
  if(ea==='doble')notes.push('✖️2 '+TN(m.ta)+' duplica: '+ra+' → '+(ra*2));
  if(eb==='doble')notes.push('✖️2 '+TN(m.tb)+' duplica: '+rb+' → '+(rb*2));
  if(ea==='robo'){var s1=Math.min(2,rb);A+=s1;B-=s1;notes.push(s1?'🦹 '+TN(m.ta)+' le roba '+s1+' game'+(s1>1?'s':'')+' a '+TN(m.tb):'🦹 El Robo de '+TN(m.ta)+' no encontró nada para robar');}
  if(eb==='robo'){var s2=Math.min(2,ra);B+=s2;A-=s2;notes.push(s2?'🦹 '+TN(m.tb)+' le roba '+s2+' game'+(s2>1?'s':'')+' a '+TN(m.ta):'🦹 El Robo de '+TN(m.tb)+' no encontró nada para robar');}
  return {a:A,b:B,notes:notes};
}
function teamTotals(){
  var r={};TEAM_IDS.forEach(function(t){r[t]={t:t,arr:S.arrastre[t]||0,g:0,pg:0,pj:0,total:0};});
  S.matches.forEach(function(m){if(m.x||m.ph!=='T'||!m.done)return;var c=teamCalc(m);
    r[m.ta].g+=c.a;r[m.tb].g+=c.b;r[m.ta].pj++;r[m.tb].pj++;
    if(m.sa>m.sb)r[m.ta].pg++;else if(m.sb>m.sa)r[m.tb].pg++;});
  TEAM_IDS.forEach(function(t){r[t].total=Math.round((r[t].arr+r[t].g)*10)/10;});
  var list=TEAM_IDS.map(function(t){return r[t];}).sort(function(a,b){return b.total-a.total||b.pg-a.pg;});
  if(S.tb.team){var i=list.findIndex(function(x){return x.t===S.tb.team;});if(i>0){var c=list.splice(i,1)[0];list.unshift(c);}}
  return list;
}
function usedCards(team,exceptId){
  var u=new Set();
  S.matches.forEach(function(m){if(m.x||m.ph!=='T'||m.id===exceptId)return;
    ['a','b'].forEach(function(s){var t=s==='a'?m.ta:m.tb;if(t!==team)return;if(m.hid[s])u.add(m.hid[s]);if(m.opn[s])u.add(m.opn[s]);});});
  return u;
}
function revealedUsed(team){
  var u=new Set();
  S.matches.forEach(function(m){if(m.x||m.ph!=='T')return;
    ['a','b'].forEach(function(s){var t=s==='a'?m.ta:m.tb;if(t!==team)return;if(m.opn[s])u.add(m.opn[s]);if(m.done&&m.hid[s])u.add(m.hid[s]);});});
  return u;
}
function usedX2(pid,exceptId){return S.matches.some(function(m){return m.ph==='M'&&!m.x&&m.id!==exceptId&&m.x2.indexOf(pid)>=0;});}

// ---------- draws
function drawMorning(court,excl){
  if(S.morningCut||countCreated('M')>=MORNING_N){toast('La mañana ya está completa');return false;}
  var busy=onCourt();
  var free=S.players.filter(function(p){return !p.out&&!busy.has(p.id)&&excl.indexOf(p.id)<0;}).map(function(p){return p.id;});
  if(free.length<4){toast('No hay 4 jugadoras libres');return false;}
  var ord=prioritySort(free,['M']);
  var under=ord.filter(function(id){return countPJ(id,['M'])<4;});
  var pick=(under.length>=4?under:ord).slice(0,4);
  var sp=bestSplit(pick);
  addMatch({ph:'M',court:court,a:sp[0],b:sp[1],target:target()});
  return true;
}
function crucesRemaining(){
  var used={};
  S.matches.forEach(function(m){if(m.ph==='T'&&!m.x){var k=[m.ta,m.tb].sort().join('-');used[k]=(used[k]||0)+1;}});
  var rem=[];CRUCES.forEach(function(c){var k=c.slice().sort().join('-');if(used[k]>0)used[k]--;else rem.push(c);});
  return rem;
}
function borrowCount(team){return S.matches.filter(function(m){return m.ph==='T'&&!m.x&&((m.ta===team&&m.bor.a)||(m.tb===team&&m.bor.b));}).length;}
function pickPair(team,opp,busy,strict,excl){
  var members=S.teams[team];
  var ok=function(id){var p=P(id);return p&&!p.out&&!busy.has(id)&&excl.indexOf(id)<0&&!(strict&&jf(id));};
  var items=members.filter(ok).map(function(id){return {id:id,pj:countPJ(id,['T']),jf:jf(id)?1:0,le:lastEnd(id),bor:false};});
  var outs=members.filter(function(id){return P(id).out;});
  if(S.settings.lesion==='prestada'&&outs.length){
    var third=TEAM_IDS.filter(function(t){return t!==team&&t!==opp;})[0];
    var pool=S.teams[third].filter(ok);
    if(pool.length){
      var vpj=(outs.reduce(function(s,id){return s+countPJ(id,['T']);},0)+borrowCount(team))/outs.length;
      var lend=shuffle(pool).sort(function(x,y){return countPJ(x,['M','T'])-countPJ(y,['M','T'])||lastEnd(x)-lastEnd(y);})[0];
      items.push({id:lend,pj:vpj,jf:0,le:0,bor:true});
    }
  }
  if(items.length<2)return null;
  items=shuffle(items).sort(function(x,y){return x.pj-y.pj||x.jf-y.jf||x.le-y.le;});
  var top=items.slice(0,3),best=null,bc=1e9;
  for(var i=0;i<top.length;i++)for(var j=i+1;j<top.length;j++){
    if(top[i].bor&&top[j].bor)continue;
    var c=(top[i].pj+top[j].pj)*10+partnerCount(top[i].id,top[j].id)*3+i+j;
    if(c<bc){bc=c;best=[top[i],top[j]];}
  }
  if(!best)return null;
  return {pair:[best[0].id,best[1].id],borrowed:best[0].bor?best[0].id:(best[1].bor?best[1].id:null)};
}
function drawAfternoon(court,excl){
  var rem=crucesRemaining();
  if(S.afternoonCut||!rem.length){toast('Ya se sortearon todos los cruces');return false;}
  var busy=onCourt(), best=null, bc=1e9;
  var minPJ=function(t){var v=S.teams[t].filter(function(id){return !P(id).out;}).map(function(id){return countPJ(id,['T']);});return v.length?Math.min.apply(null,v):0;};
  var excess=function(t,pair,bor){return pair.reduce(function(s,id){return s+(id===bor?0:countPJ(id,['T'])-minPJ(t));},0);};
  var viol=function(t,pair){var act=S.teams[t].filter(function(id){return !P(id).out;});if(act.length!==5)return 0;
    var c=act.map(function(id){return countPJ(id,['T'])+(pair.indexOf(id)>=0?1:0);});
    return (c.some(function(v){return v>4;})||c.filter(function(v){return v===4;}).length>1)?1:0;};
  for(var k=0;k<2;k++){var strict=k===0;
    for(var i=0;i<rem.length;i++){var t1=rem[i][0],t2=rem[i][1];
      var A=pickPair(t1,t2,busy,strict,excl);if(!A)continue;
      var b2=new Set(busy);A.pair.forEach(function(id){b2.add(id);});
      var B=pickPair(t2,t1,b2,strict,excl);if(!B)continue;
      var cost=(viol(t1,A.pair)+viol(t2,B.pair))*1000+(strict?0:50)+(excess(t1,A.pair,A.borrowed)+excess(t2,B.pair,B.borrowed))*5+i*0.1;
      if(cost<bc){bc=cost;best={t1:t1,t2:t2,A:A,B:B};}
    }
  }
  if(best&&bc>=1000&&live().length&&!FORCE){WAIT=true;return false;}
  if(best){addMatch({ph:'T',court:court,ta:best.t1,tb:best.t2,a:best.A.pair,b:best.B.pair,bor:{a:best.A.borrowed,b:best.B.borrowed},target:target()});return true;}
  toast('No hay jugadoras libres para ningún cruce. Esperá a que termine la otra cancha.');
  return false;
}
function drawSunday(court,excl){
  if(court===1){
    var idx=countCreated('F');if(idx>=3){toast('La final ya está completa');return false;}
    var f=S.sunday.final;var sp=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]][idx];
    var busy=onCourt();if(f.some(function(id){return busy.has(id);})){toast('Hay finalistas en la otra cancha');return false;}
    addMatch({ph:'F',court:1,a:sp[0].map(function(i){return f[i];}),b:sp[1].map(function(i){return f[i];}),target:target()});
    return true;
  }
  if(countCreated('R')>=3){toast('La revancha ya está completa');return false;}
  var bz=onCourt();
  var free=S.players.filter(function(p){return !p.out&&S.sunday.final.indexOf(p.id)<0&&!bz.has(p.id)&&excl.indexOf(p.id)<0;}).map(function(p){return p.id;});
  if(free.length<4){toast('No hay 4 jugadoras libres');return false;}
  var sp2=bestSplit(prioritySort(free,['R']).slice(0,4));
  addMatch({ph:'R',court:2,a:sp2[0],b:sp2[1],target:target()});
  return true;
}
function drawFor(court,excl){
  excl=excl||[];
  if(S.phase==='morning')return drawMorning(court,excl);
  if(S.phase==='afternoon')return drawAfternoon(court,excl);
  if(S.phase==='sunday')return drawSunday(court,excl);
  return false;
}
function canDraw(c){
  if(S.phase==='morning'){if(S.morningCut)return {ok:false,msg:'Mañana cerrada ✋'};
    if(countCreated('M')>=MORNING_N)return {ok:false,msg:'¡Ya salieron todos los partidos de la mañana! 🎉'};return {ok:true};}
  if(S.phase==='afternoon'){if(S.afternoonCut)return {ok:false,msg:'Tarde cerrada ✋'};
    if(!crucesRemaining().length)return {ok:false,msg:'¡Ya salieron todos los cruces! 🎉'};return {ok:true};}
  if(S.phase==='sunday'){if(c===1)return countCreated('F')<3?{ok:true}:{ok:false,msg:'Final completa 🏆'};
    return countCreated('R')<3?{ok:true}:{ok:false,msg:'Revancha completa 🎉'};}
  return {ok:false,msg:''};
}
function drawTeams(){
  if(S.players.length!==15){toast('Se necesitan 15 jugadoras');return false;}
  var rk=ranking(['M']), st=statMap(['M']);
  var teams={azul:[],verde:[],naranja:[]}, leaders={}, bombos=[];
  for(var b=0;b<5;b++){var bo=rk.slice(b*3,b*3+3).map(function(r){return r.id;});bombos.push(bo);
    var order=shuffle(TEAM_IDS);bo.forEach(function(id,i){teams[order[i]].push(id);if(b===0)leaders[order[i]]=id;});}
  var arr={};TEAM_IDS.forEach(function(t){arr[t]=Math.round(teams[t].reduce(function(s,id){return s+st[id].avg;},0)*10)/10;});
  S.teams=teams;S.leaders=leaders;S.arrastre=arr;S.bombos=bombos;S.openPick={};
  S.pickOrder=rk.slice(0,3).map(function(r){return teamOf(r.id);});
  return true;
}

function matchBody(m){

}
function queueCard(){
  if(S.phase!=='morning'&&S.phase!=='afternoon')return '';
  var busy=onCourt(), phs=S.phase==='morning'?['M']:['T'];
  var free=S.players.filter(function(p){return !p.out&&!busy.has(p.id);}).map(function(p){return p.id;});
  var ord=prioritySort(free,phs).sort(function(a,b){return countPJ(a,phs)-countPJ(b,phs)||(jf(a)?1:0)-(jf(b)?1:0)||lastEnd(a)-lastEnd(b);});

var R=null;
function openResult(id){var m=getM(id);if(!m)return;R={id:m.id,sa:m.sa,sb:m.sb,partial:m.partial,x2:m.x2.slice(),hid:{a:m.hid.a,b:m.hid.b}};renderResult();}
function validate(m){
  if(R.sa==null||R.sb==null)return 'Elegí los games de las dos parejas';
  if(R.partial)return '';
  var T=m.target;if(!((R.sa===T&&R.sb<T)||(R.sb===T&&R.sa<T)))return 'Una pareja tiene que llegar a '+T+' y la otra quedar abajo. Si se cortó, marcá “partido incompleto”.';
  return '';
}
function hidSelect(m,s){
  var team=s==='a'?m.ta:m.tb, used=usedCards(team,m.id);
  if(m.opn[s])return '<div class="rside" style="--tc:'+TEAMS[team].color+'"><b>'+TEAMS[team].emoji+' '+TEAMS[team].name+'</b>: usó la abierta '+CARDS[m.opn[s]].name+'</div>';
  var opts=HIDDEN.filter(function(c){return !used.has(c);});
  return '<div class="rside" style="--tc:'+TEAMS[team].color+'"><b>'+TEAMS[team].emoji+' '+TEAMS[team].name+'</b><div>'+
    '<button class="tog '+(!R.hid[s]?'on':'')+'" data-act="rhid" data-arg="'+s+':">Ninguna</button>'+
    opts.map(function(c){return '<button class="tog '+(R.hid[s]===c?'on':'')+'" data-act="rhid" data-arg="'+s+':'+c+'">'+CARDS[c].icon+' '+CARDS[c].name+'</button>';}).join('')+'</div></div>';
}
function renderResult(){
  var m=getM(R.id), T=m.target;
  var sideH=function(s){var team=m.ph==='T'?(s==='a'?m.ta:m.tb):null,v=s==='a'?R.sa:R.sb,pl='';

    return '<div class="rside" '+(team?'style="--tc:'+TEAMS[team].color+'"':'')+'><div class="rnames">'+(team?TEAMS[team].emoji+' ':'')+m[s].map(function(id){return esc(nm(id));}).join(' + ')+'</div><div class="pills">'+pl+'</div></div>';};
  var h='<h2>'+(m.done?'✏️ Editar resultado':'🎾 ¿Cómo salió?')+'</h2><p class="muted">Cancha '+m.court+' · a '+T+' games</p>'+sideH('a')+'<div class="vs sm">VS</div>'+sideH('b');
  if(m.ph==='M'){
    h+='<h3>✖️2 Comodín</h3><p class="muted">¿Alguna usó su comodín en este partido?</p><div>'+m.a.concat(m.b).map(function(id){
      var used=usedX2(id,m.id),on=R.x2.indexOf(id)>=0;
      return '<button class="tog '+(on?'on':'')+'" '+(used&&!on?'disabled':'')+' data-act="rx2" data-arg="'+id+'">'+(on?'✖️2 ':'')+esc(nm(id))+(used&&!on?' · ya lo usó':'')+'</button>';}).join('')+'</div>';
  }
  if(m.ph==='T'&&S.settings.cards)h+='<h3>🤫 Cartas ocultas</h3><p class="muted">Se revelan ahora. Revisá que esté lo que activaron.</p>'+hidSelect(m,'a')+hidSelect(m,'b');

  modal(h);
}

    c.notes.map(function(n){return '<div class="note">'+n+'</div>';}).join('')+'<button class="btn big mt" data-act="close">¡Vamos! 💪</button>');
}

// ---------- hidden / open card modals
var H=null, O=null, RR=null;
function openHid(id,s){
  var m=getM(id), team=s==='a'?m.ta:m.tb;
  if(m.opn[s])return modal('<h2>🤫 Carta oculta</h2><p>Esta pareja ya cantó una carta abierta en este partido. Solo se puede usar una carta por pareja por partido.</p><button class="btn w" data-act="close">Entendido</button>');
  H={id:m.id,s:s,sel:m.hid[s]};renderHid(false);
}
function renderHid(anim){
  var m=getM(H.id), team=H.s==='a'?m.ta:m.tb, used=usedCards(team,m.id);
  var avail=HIDDEN.filter(function(c){return !used.has(c);});
  modal('<h2>🤫 Carta oculta · <span style="color:'+TEAMS[team].color+'">'+TEAMS[team].name+'</span></h2><p class="muted">Que mire solo el equipo '+TEAMS[team].name+'. Tocá la carta que quieren usar.</p>'+
    (avail.length?'<div class="cards">'+HIDDEN.map(function(c){if(used.has(c))return gcard(c,{fl:true,cls:'used'});return gcard(c,{act:'hpick',fl:true,cls:H.sel===c?'sel':''});}).join('')+'</div>':'<p class="note">Este equipo ya usó sus 3 cartas ocultas.</p>')+
    (H.sel?'<p class="desc">'+CARDS[H.sel].desc+'</p><button class="btn p big" data-act="hsave">🤫 Activar '+CARDS[H.sel].name+'</button>':'')+
    '<button class="btn w sm" data-act="hnone">'+(m.hid[H.s]?'Quitar la carta activada':'Ninguna, cerrar')+'</button>');
}
function openOpn(id,s){
  var m=getM(id), team=s==='a'?m.ta:m.tb;O={id:m.id,s:s};
  if(m.opn[s])return modal('<h2>📣 '+CARDS[m.opn[s]].name+'</h2><div class="cards">'+gcard(m.opn[s],{fl:true,cls:'big'})+'</div><p class="desc">'+CARDS[m.opn[s]].desc+'</p><button class="btn r" data-act="onone">Quitar (se cargó por error)</button><button class="btn w sm" data-act="close">Cerrar</button>');
  if(m.hid[s])return modal('<h2>📣 Carta abierta</h2><p>Esta pareja ya activó una carta en este partido. Solo se puede usar una carta por pareja por partido.</p><button class="btn w" data-act="close">Entendido</button>');
  var c=S.openPick[team];
  modal('<h2 class="center">📣 ¡'+TEAMS[team].name+' canta!</h2><div class="cards">'+gcard(c,{cls:'big',flipme:true})+'</div><p class="desc">'+CARDS[c].desc+'<br><span class="muted">Dura un solo game.</span></p><button class="btn o big" data-act="osave">¡Confirmar!</button><button class="btn w sm" data-act="close">Cancelar</button>');
}
function openReroll(id){RR={id:+id,ex:[]};renderReroll();}
function renderReroll(){var m=getM(RR.id);
  modal('<h2>🔁 Re-sortear</h2><p class="muted">¿Falta alguien? Marcala y no entra en este sorteo. Si no marcás a nadie, se sortea de nuevo igual.</p><div>'+
    m.a.concat(m.b).map(function(id){var on=RR.ex.indexOf(id)>=0;return '<button class="tog '+(on?'on':'')+'" data-act="rrx" data-arg="'+id+'">'+(on?'🚫 ':'')+esc(nm(id))+'</button>';}).join('')+
    '</div><button class="btn y big mt" data-act="rrgo">🎲 Sortear de nuevo</button><button class="btn w sm" data-act="close">Cancelar</button>');}

// ---------- ties
var TIE=null;
function tieCands(key){
  if(key==='ind')return tiedInd().map(function(id){return {id:id,label:nm(id)};});
  if(key==='team')return tiedTeam().map(function(t){return {id:t,label:TEAMS[t].emoji+' '+TEAMS[t].name};});
  var st=statMap(['F']),f=S.sunday.final.slice().sort(function(a,b){return st[b].g-st[a].g||st[b].pg-st[a].pg;});
  return f.filter(function(id){return st[id].g===st[f[0]].g&&st[id].pg===st[f[0]].pg;}).map(function(id){return {id:id,label:nm(id)};});
}
function openTie(key){TIE={key:key,c:tieCands(key)};
  modal('<h2>🤝 ¡Empate!</h2><p>'+TIE.c.map(function(x){return '<b>'+esc(x.label)+'</b>';}).join(' y ')+' están igualadas. ¿Cómo lo definen?</p>'+
    '<button class="btn y big" data-act="tieTb">🎾 Tiebreak a 10</button><button class="btn v big" data-act="tieRnd">🎲 Sorteo</button><button class="btn w sm" data-act="close">Más tarde</button>');}
function setTie(id){commit(function(){S.tb[TIE.key]=id;});closeModal();confetti();toast('🏆 ¡Tenemos campeona!');}

// ---------- sharing / backup
function shareText(){
  var t='🎾 Torneo de dobles\n\n';
  if(S.teams){t+='🛡️ Equipos\n';teamTotals().forEach(function(r,i){t+=(i+1)+'. '+TEAMS[r.t].emoji+' '+TEAMS[r.t].name+': '+fmt(r.total)+' games\n';});t+='\n';}
  var rk=(S.phase==='morning'||S.phase==='midday')?ranking(['M']):satRanking();
  t+='🏅 Ranking individual (promedio)\n';rk.forEach(function(r,i){t+=(i+1)+'. '+r.name+' — '+fmt(r.avg)+' ('+r.pj+' PJ)\n';});
  if(S.sunday&&S.tb.final)t+='\n👑 Campeona del torneo: '+nm(S.tb.final)+'\n';
  return t;
}
function copy(txt){if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(txt).then(function(){toast('📋 Copiado');},function(){fallbackCopy(txt);});}fallbackCopy(txt);}
function fallbackCopy(txt){modal('<h2>📋 Copiá este texto</h2><textarea rows="10">'+esc(txt)+'</textarea><button class="btn w sm" data-act="close">Cerrar</button>');}
function doShare(){var t=shareText();if(navigator.share){navigator.share({text:t}).catch(function(){});}else copy(t);}
function doExport(){
  var data=JSON.stringify(S), name='torneo-respaldo-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.json';
  try{var f=new File([data],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Respaldo torneo'}).catch(function(){});return;}}catch(e){}
  try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('💾 Respaldo descargado');}catch(e){copy(data);}
}
function openImport(){modal('<h2>📥 Importar respaldo</h2><p class="muted">Elegí el archivo de respaldo o pegá su contenido. Reemplaza todo lo que hay ahora.</p><input type="file" id="impf" accept=".json,application/json"><textarea id="impt" rows="6" placeholder="…o pegá acá el texto del respaldo"></textarea><button class="btn b mt" data-act="impgo">Importar</button><button class="btn w sm" data-act="close">Cancelar</button>');
  var f=$('#impf');if(f)f.addEventListener('change',function(){var file=f.files[0];if(!file)return;var rd=new FileReader();rd.onload=function(){$('#impt').value=rd.result;};rd.readAsText(file);});}

// ---------- actions
var A={};
A.tab=function(a){TAB=a;closeModal();render();window.scrollTo(0,0);};
A.rkv=function(a){RKV=a;render();};
A.undo=undo;
A.close=closeModal;
A.ovclose=function(a,el,e){if(e.target===el)closeModal();};
A.demo=function(){SETUP_DRAFT=['Ana','Belu','Caro','Dani','Eli','Flor','Gabi','Juli','Lu','Meli','Nati','Pau','Romi','Sofi','Vicky'].join('\n');render();};
A.start=function(){
  var names=($('#names').value||'').split('\n').map(function(s){return s.trim();}).filter(Boolean);
  if(names.length!==15)return toast('Tienen que ser 15 jugadoras (hay '+names.length+')');
  var low=names.map(function(n){return n.toLowerCase();});if(new Set(low).size!==15)return toast('Hay nombres repetidos');
  commit(function(){S.players=names.map(function(n,i){return {id:'p'+(i+1),name:n,out:false,rnd:Math.random()};});S.phase='morning';TAB='canchas';});
  toast('☀️ ¡Arranca la mañana!');
};
A.draw=function(a){var c=+a;WAIT=false;FORCE=false;if(tryCommit(function(){return drawFor(c,[]);}))return toast('🎲 ¡Partido sorteado!');
  if(WAIT)modal('<h2>⏳ Conviene esperar</h2><p>Las jugadoras que menos jugaron están en la otra cancha. Si esperás a que termine, todas terminan la tarde con la misma cantidad de partidos.</p><button class="btn y big" data-act="close">Espero 👍</button><button class="btn w sm" data-act="drawForce" data-arg="'+c+'">Sortear igual</button>');};
A.drawForce=function(a){closeModal();FORCE=true;var ok=tryCommit(function(){return drawFor(+a,[]);});FORCE=false;if(ok)toast('🎲 ¡Partido sorteado!');};
A.result=function(a){openResult(a);};
A.rs=function(a){var p=a.split(':'),s=p[0],v=+p[1],m=getM(R.id),T=m.target;
  if(s==='a'){R.sa=v;if(!R.partial&&v<T&&R.sb==null)R.sb=T;}else{R.sb=v;if(!R.partial&&v<T&&R.sa==null)R.sa=T;}
  if(!R.partial&&v===T){if(s==='a'&&R.sb===T)R.sb=null;if(s==='b'&&R.sa===T)R.sa=null;}
  renderResult();};
A.rx2=function(a){var i=R.x2.indexOf(a);if(i>=0)R.x2.splice(i,1);else R.x2.push(a);renderResult();};
A.rhid=function(a){var p=a.split(':');R.hid[p[0]]=p[1]||null;renderResult();};
A.rpart=function(){R.partial=!R.partial;renderResult();};
A.rsave=function(){var m=getM(R.id);if(validate(m))return;var was;
  commit(function(){was=applyResult(m,R.sa,R.sb,{partial:R.partial,x2:R.x2,hid:R.hid});});
  closeModal();
  if(m.ph==='T')showReveal(m);
  else{toast(was?'✏️ Resultado corregido':'✅ ¡Resultado guardado!');if(m.x2.length)setTimeout(function(){toast('✖️2 Comodín de '+m.x2.map(nm).join(' y '));},900);}
};
A.cancel=function(a){ask('✖️ Cancelar partido','Las jugadoras vuelven a la fila.','Sí, cancelar','p',function(){commit(function(){getM(a).x=true;});});};
A['void']=function(a){ask('🗑️ Anular partido','Se borra del ranking y de la tabla de equipos.','Sí, anular','p',function(){commit(function(){getM(a).x=true;});toast('🗑️ Partido anulado');});};
A.reroll=function(a){openReroll(a);};
A.rrx=function(a){var i=RR.ex.indexOf(a);if(i>=0)RR.ex.splice(i,1);else RR.ex.push(a);renderReroll();};
A.rrgo=function(){var id=RR.id,ex=RR.ex.slice();closeModal();
  if(tryCommit(function(){var m=getM(id);m.x=true;return drawFor(m.court,ex);}))toast('🎲 ¡Nuevo sorteo!');};
A.hid=function(a){var p=a.split(':');openHid(p[0],p[1]);};
A.hpick=function(a){H.sel=(H.sel===a?null:a);renderHid(true);};
A.hsave=function(){var h=H;commit(function(){getM(h.id).hid[h.s]=h.sel;});closeModal();toast('🤫 Carta guardada en secreto');};
A.hnone=function(){var h=H,m=getM(h.id);if(m.hid[h.s])commit(function(){m.hid[h.s]=null;});closeModal();};
A.opn=function(a){var p=a.split(':');openOpn(p[0],p[1]);};
A.osave=function(){var o=O,m=getM(o.id),team=o.s==='a'?m.ta:m.tb;commit(function(){m.opn[o.s]=S.openPick[team];});closeModal();toast('📣 ¡'+CARDS[m.opn[o.s]].name+'!');};
A.onone=function(){var o=O;commit(function(){getM(o.id).opn[o.s]=null;});closeModal();};
A.toMidday=function(){commit(function(){S.phase='midday';});window.scrollTo(0,0);};
A.drawTeams=function(){if(tryCommit(drawTeams)){confetti();window.scrollTo(0,0);}};
A.pick=function(a){var next=S.pickOrder.filter(function(t){return !S.openPick[t];})[0];if(!next)return;
  commit(function(){S.openPick[next]=a;});toast(TEAMS[next].emoji+' '+TEAMS[next].name+' se lleva '+CARDS[a].name);};
A.toAfternoon=function(){commit(function(){S.phase='afternoon';S.settings.emergency=false;});toast('🌇 ¡Arranca la tarde!');window.scrollTo(0,0);};
A.toClosed=function(){commit(function(){S.phase='closed';});confetti();window.scrollTo(0,0);};
A.toSunday=function(){ask('🌞 Domingo','Juegan la Gran Final las 4 primeras del ranking del sábado. El resto juega la Copa Revancha.','¡Arrancar!','o',function(){
  commit(function(){S.sunday={final:satRanking().slice(0,4).map(function(r){return r.id;})};S.phase='sunday';S.settings.emergency=false;TAB='canchas';});window.scrollTo(0,0);});};
A.tie=function(a){openTie(a);};
A.tieTb=function(){modal('<h2>🎾 Tiebreak a 10</h2><p>Que lo jueguen y tocá a la ganadora.</p>'+TIE.c.map(function(x){return '<button class="btn y" data-act="tieWin" data-arg="'+x.id+'">🏆 Ganó '+esc(x.label)+'</button>';}).join('')+'<button class="btn w sm" data-act="close">Cancelar</button>');};
A.tieWin=function(a){setTie(a);};
A.tieRnd=function(){var c=TIE.c,i=0;modal('<h2>🎲 Sorteando…</h2><div class="roul" id="roul">…</div>');
  var iv=setInterval(function(){var el=$('#roul');if(el)el.textContent=c[i++%c.length].label;},90);
  setTimeout(function(){clearInterval(iv);var w=c[Math.floor(Math.random()*c.length)];var el=$('#roul');if(el)el.textContent='🏆 '+w.label;setTimeout(function(){setTie(w.id);},1200);},2200);};
A.tgCards=function(){commit(function(){S.settings.cards=!S.settings.cards;});};
A.tgEmerg=function(){commit(function(){S.settings.emergency=!S.settings.emergency;});toast(S.settings.emergency?'⚡ Los próximos partidos van a 3 games':'Partidos a 5 games');};
A.tgLesion=function(){commit(function(){S.settings.lesion=S.settings.lesion==='4'?'prestada':'4';});};
A.tgOut=function(a){commit(function(){var p=P(a);p.out=!p.out;});};
A.rename=function(a){var p=P(a);modal('<h2>✏️ Cambiar nombre</h2><textarea id="rnm" rows="1">'+esc(p.name)+'</textarea><button class="btn big mt" data-act="rnmok" data-arg="'+a+'">Guardar</button><button class="btn w sm" data-act="close">Cancelar</button>');};
A.rnmok=function(a){var n=($('#rnm').value||'').trim();if(!n)return toast('Escribí un nombre');var p=P(a);closeModal();commit(function(){p.name=n;});};
A.askok=function(){var f=PENDING;PENDING=null;closeModal();if(f)f();};
A.cutMorning=function(){ask('✋ Cerrar la mañana','No se sortean más partidos. Los que están en juego se terminan y después pasás al sorteo de equipos.','Sí, cerrar','p',function(){commit(function(){S.morningCut=true;});});};
A.cutAfternoon=function(){ask('✋ Terminar la tarde','Ojo: algunos equipos pueden quedar con menos partidos. Si vienen atrasadas, mejor el modo emergencia a 3 games.','Sí, terminar','p',function(){commit(function(){S.afternoonCut=true;});});};
A.share=doShare;
A['export']=doExport;
A['import']=openImport;
A.impgo=function(){try{var s=JSON.parse($('#impt').value);if(!s||!s.players||!s.matches)throw 0;ask('📥 Importar','Esto reemplaza todo lo que hay ahora por el respaldo.','Sí, importar','b',function(){commit(function(){S=s;});toast('📥 Respaldo cargado');});}catch(e){toast('Ese respaldo no es válido');}};
A.reset=function(){ask('🧨 Volver a empezar','Se borra todo el torneo: jugadoras, partidos, equipos y ranking. <b>No se puede deshacer.</b> Si querés, antes exportá un respaldo.','Sí, borrar todo','p',function(){S=newState();hist=[];SETUP_DRAFT='';persist();TAB='canchas';render();window.scrollTo(0,0);toast('🧨 Torneo reiniciado');});};

document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el||el.disabled)return;var f=A[el.dataset.act];if(f)f(el.dataset.arg,el,e);});
setInterval(function(){if(!$('#modal-root').innerHTML&&TAB==='canchas'&&live().length)render();},30000);
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){});}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
window.__T={get S(){return S;},set S(v){S=v;},drawFor:drawFor,drawTeams:drawTeams,applyResult:applyResult,ranking:ranking,teamTotals:teamTotals,crucesRemaining:crucesRemaining,live:live,countPJ:countPJ,partnerCount:partnerCount,teamCalc:teamCalc,render:render,canDraw:canDraw};
render();
})();
</script>
