<style>

.gc .ic{font-size:40px;line-height:1}.gc .nm{font-weight:900;font-size:14px;margin-top:8px;line-height:1.1}

.team{padding:0;overflow:hidden}
.team .th{--tc:#7B3FF2;background:var(--tc);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.team .th .pos{font-size:28px}.team .th .tn{font-size:22px;font-weight:900}
.team .th .tt{margin-left:auto;text-align:right;font-weight:900;font-size:30px;line-height:1}
.team .th .tt small{display:block;font-size:11px;opacity:.9;letter-spacing:.5px}

.mem{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #E6DDFF;font-weight:800}
.mem:last-child{border-bottom:0}
.mem .r{color:#7A6F99;font-size:13px}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}

table.rk td:first-child{border-radius:10px 0 0 10px}table.rk td:last-child{border-radius:0 10px 10px 0}
.seg{display:flex;background:rgba(255,255,255,.18);border-radius:16px;padding:4px;margin:10px 0}
.seg button{flex:1;border:0;background:none;color:#fff;font:inherit;font-weight:900;font-size:15px;padding:9px;border-radius:12px}

.podium .pd{flex:1;text-align:center;font-weight:900}
.podium .pd .bar{border-radius:14px 14px 0 0;color:#fff;font-size:28px;display:flex;align-items:flex-start;justify-content:center;padding-top:8px}
.podium .pd .who{font-size:15px;margin-bottom:6px;overflow-wrap:anywhere}
textarea{width:100%;border:2px solid #E6DDFF;border-radius:16px;padding:12px;font:inherit;font-size:17px;font-weight:700;color:#24183F;resize:vertical;outline:none}
textarea:focus{border-color:#7B3FF2}
.list-m{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed #E6DDFF;font-weight:800;font-size:14px}
.list-m .tx{flex:1;min-width:0}
.list-m .ph{font-size:11px;background:#F0EAFF;color:#4A1FC2;border-radius:8px;padding:2px 6px;margin-right:4px}
.sbtn{border:0;background:#F0EAFF;border-radius:10px;padding:8px 10px;font-size:16px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed #E6DDFF;font-weight:800}
.setrow:last-child{border-bottom:0}
.sw{border:0;border-radius:999px;padding:8px 14px;font:inherit;font-weight:900;font-size:14px;background:#EEE;color:#555;white-space:nowrap}
.sw.on{background:#22C55E;color:#fff}
.sw.bad{background:#FF4D8D;color:#fff}
details summary{font-weight:900;cursor:pointer;padding:4px 0}
details li{margin:4px 0;line-height:1.35}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#24183F;color:#fff;font-weight:800;padding:12px 18px;border-radius:16px;z-index:40;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:pop .3s}
.confetti{position:fixed;top:-40px;font-size:26px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(600deg)}}
.roul{font-size:30px;font-weight:900;text-align:center;padding:18px;border-radius:18px;background:#F0EAFF;color:#4A1FC2;margin:10px 0}
.bombo{display:flex;gap:8px;align-items:center;padding:6px 0;font-weight:800}
.bombo .bn{background:#4A1FC2;color:#fff;border-radius:10px;padding:4px 8px;font-size:12px;white-space:nowrap}
.crown{font-size:16px}
.whiteh{color:#fff;margin:14px 2px 0}

.clock{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:900;font-size:14px;border-radius:12px;padding:7px 10px}
.clock.ok{background:#E3F9EA;color:#137A3A}.clock.warn{background:#FFF1DB;color:#A35A00}.clock.bad{background:#FFE4E4;color:#B3261E}
.hint{background:#FFF7E0;border-radius:12px;padding:9px 12px;margin-top:8px;font-weight:800;font-size:14px;color:#6b4b00}

.pair.dbl{background:#FFF6D6;box-shadow:inset 0 0 0 3px #FFC531}
.tagd{display:inline-block;background:#FFC531;color:#3a2a00;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:900;margin-bottom:4px}

.cstrip{display:flex;gap:10px;align-items:center;border-radius:16px;padding:10px 12px;margin:0 0 10px;color:#fff}
.cstrip .ci{font-size:34px;line-height:1;flex:none}
.cstrip .ct{font-weight:900;font-size:16px}.cstrip .cd{font-size:14px;font-weight:700;opacity:.95;line-height:1.3}
.cstrip .ck{font-size:11px;font-weight:900;letter-spacing:.5px;opacity:.9;text-transform:uppercase}
.say{background:#F0EAFF;border-radius:14px;padding:10px 12px;margin:0 0 10px;font-weight:800;color:#3B16A8;font-size:15px;line-height:1.35}

<body>
<div id="app"></div>
<div id="modal-root"></div>
<script>
(function(){
'use strict';
var KEY='torneoDobles.v2', HKEY='torneoDobles.hist.v2';
var TEAMS={azul:{name:'Azul',color:'#2D7FF9',emoji:'🔵'},verde:{name:'Verde',color:'#1DB954',emoji:'🟢'},naranja:{name:'Naranja',color:'#FF8A1F',emoji:'🟠'}};
var TEAM_IDS=['azul','verde','naranja'];
var CARDS={
  sinsegundo:{name:'Sin segundo saque',kind:'contra',icon:'🎯',color:'#16A06A',desc:'En sus 2 primeros games de saque (uno cada una) sacan con un solo saque.'},
  mano:{name:'Mano cambiada',kind:'contra',icon:'🤚',color:'#D63BB0',desc:'El rival elige a una de las dos: juega un game con la otra mano.'},
  turbo:{name:'Turbo',kind:'beneficio',icon:'🚀',color:'#F26A00',desc:'Si ganan, su equipo suma +2 games.'},
  robo:{name:'Robo',kind:'beneficio',icon:'🦹',color:'#E8334F',desc:'Si ganan, le roban 2 games al equipo rival.'},
  arriba:{name:'Empiezan ganando',kind:'arranque',icon:'🎁',color:'#1E88D9',desc:'Arrancan el partido 1-0 arriba. Ese game cuenta en el marcador.'},
  abajo:{name:'Empiezan perdiendo',kind:'arranque',icon:'🐢',color:'#7A4FE0',desc:'Arrancan el partido 0-1 abajo. Ese game cuenta en el marcador.'}
};
var KIND={contra:'➖ Contra',beneficio:'➕ Beneficio',arranque:'🎲 Arranque'};
var FINAL_N=3, DEF_DUR=38, SUN_MAX=125, JF=4*60*1000;
function NC(){return S.settings.courts===3?3:2;}
function COURTS(){return NC()===3?[1,2,3]:[1,2];}
function MORNING_N(){return NC()===3?15:10;}
function AFT_N(){return NC()===3?12:9;}
function REV_N(){return NC()===3?8:5;}
function KCR(){return AFT_N()/3;}
var DURS=[180,195,210,225];

function newState(){return {v:2,phase:'setup',players:[],settings:{cards:true,emergency:false,lesion:'4',maxMin:195,courts:2},
  matches:[],seq:1,teams:null,leaders:null,arrastre:{},bombos:null,cardPlan:null,extraM:0,
  morningCut:false,afternoonCut:false,tb:{},sunday:null,clock:{}};}
function load(){try{var r=localStorage.getItem(KEY);if(r){var s=JSON.parse(r);if(s&&s.v===2&&s.players)return s;}}catch(e){}return newState();}
function loadHist(){try{var r=localStorage.getItem(HKEY);if(r)return JSON.parse(r)||[];}catch(e){}return [];}
var S=load(), hist=loadHist(), TAB='canchas', RKV='sab', SETUP_DRAFT='';
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(HKEY,JSON.stringify(hist.slice(-30)));}catch(e){toast('⚠️ No se pudo guardar en el teléfono');}}
function commit(fn){hist.push(JSON.stringify(S));if(hist.length>30)hist.shift();fn();persist();render();}
function tryCommit(fn){var snap=JSON.stringify(S);var ok=fn();if(ok){hist.push(snap);if(hist.length>30)hist.shift();persist();}else{S=JSON.parse(snap);}render();return ok;}

// ---------- helpers
function $(q){return document.querySelector(q);}
function now(){return (window.__NOW!=null)?window.__NOW:Date.now();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function P(id){for(var i=0;i<S.players.length;i++)if(S.players[i].id===id)return S.players[i];return null;}
function nm(id){var p=P(id);return p?p.name:'?';}
function names(ids){return ids.map(nm).map(esc).join(' y ');}
function getM(id){id=+id;for(var i=0;i<S.matches.length;i++)if(S.matches[i].id===id)return S.matches[i];return null;}
function live(){return S.matches.filter(function(m){return !m.done&&!m.x;});}
function onCourt(){var s=new Set();live().forEach(function(m){m.a.concat(m.b).forEach(function(id){s.add(id);});});return s;}
function courtMatch(c){return live().filter(function(m){return m.court===c;})[0]||null;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function fmt(n){n=Math.round(n*10)/10;return String(n).replace('.',',');}
function fmt2(n){return (Math.round(n*100)/100).toFixed(2).replace('.',',');}
function hhmm(t){var d=new Date(t);return (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();}
function dur(min){min=Math.max(0,Math.round(min));var h=Math.floor(min/60),m=min%60;return h?(h+' h '+(m<10?'0':'')+m):(m+' min');}
function teamOf(pid){if(!S.teams)return null;for(var i=0;i<3;i++){if(S.teams[TEAM_IDS[i]].indexOf(pid)>=0)return TEAM_IDS[i];}return null;}
function has(m,pid){return m.a.indexOf(pid)>=0||m.b.indexOf(pid)>=0;}
function sideOf(m,pid){return m.a.indexOf(pid)>=0?'a':(m.b.indexOf(pid)>=0?'b':null);}
function other(s){return s==='a'?'b':'a';}
function isDbl(m,s){return !!(m.dbl&&m.dbl.indexOf(s)>=0);}
function dblSides(m){return m.dbl?m.dbl.split(''):[];}
function valid(m){return !m.x;}
function countPJ(pid,phs){return S.matches.filter(function(m){return valid(m)&&phs.indexOf(m.ph)>=0&&has(m,pid);}).length;}
function countCreated(ph){return S.matches.filter(function(m){return m.ph===ph&&valid(m);}).length;}
function countDone(ph){return S.matches.filter(function(m){return m.ph===ph&&valid(m)&&m.done;}).length;}
function lastEnd(pid){var t=0;S.matches.forEach(function(m){if(m.done&&valid(m)&&has(m,pid))t=Math.max(t,m.t1||0);});return t;}
function jf(pid){var t=lastEnd(pid);return !!t&&(now()-t)<JF;}
function together(m,p,q){return (m.a.indexOf(p)>=0&&m.a.indexOf(q)>=0)||(m.b.indexOf(p)>=0&&m.b.indexOf(q)>=0);}
function against(m,p,q){return (m.a.indexOf(p)>=0&&m.b.indexOf(q)>=0)||(m.b.indexOf(p)>=0&&m.a.indexOf(q)>=0);}
function partnerCount(p,q){return S.matches.filter(function(m){return valid(m)&&together(m,p,q);}).length;}
function oppCount(p,q){return S.matches.filter(function(m){return valid(m)&&against(m,p,q);}).length;}
function target(){return S.settings.emergency?3:5;}
function factor(m){return 5/(m.target||5);}
function mins(m){return Math.max(0,Math.floor((now()-m.t0)/60000));}
function extrasOn(ph){if(!S.settings.cards)return false;if(ph==='M'||ph==='T')return true;if(ph==='R')return !!(S.sunday&&S.sunday.extras);return false;}
function phOfPhase(){return S.phase==='morning'?['M']:S.phase==='afternoon'?['T']:S.phase==='sunday'?['F','R']:[];}
function planned(ph){return ph==='M'?MORNING_N()+(S.extraM||0):ph==='T'?(S.aftN||AFT_N()):ph==='F'?FINAL_N:REV_N();}
function prioritySort(ids,phs){
  return shuffle(ids).map(function(id){return {id:id,pj:countPJ(id,phs),jf:jf(id)?1:0,le:lastEnd(id)};})
    .sort(function(x,y){return x.pj-y.pj||x.jf-y.jf||x.le-y.le;}).map(function(o){return o.id;});
}
function splitCost(a,b){var W=NC()===3?2000:300;return partnerCount(a[0],a[1])*W+partnerCount(b[0],b[1])*W+oppCount(a[0],b[0])+oppCount(a[0],b[1])+oppCount(a[1],b[0])+oppCount(a[1],b[1]);}
function bestSplit(f,need){
  var opts=shuffle([[[f[0],f[1]],[f[2],f[3]]],[[f[0],f[2]],[f[1],f[3]]],[[f[0],f[3]],[f[1],f[2]]]]);
  var best=null,bc=1e9;
  var both=function(p){return need&&need.has(p[0])&&need.has(p[1]);};
  var any=function(p){return need&&(need.has(p[0])||need.has(p[1]));};
  opts.forEach(function(o){var c=splitCost(o[0],o[1])-((both(o[0])||both(o[1]))?(NC()===3?250:120):0)+((any(o[0])&&any(o[1]))?150:0);if(c<bc){bc=c;best=o;}});
  return {a:best[0],b:best[1],cost:bc};
}
function addMatch(o){
  var m={id:S.seq++,ph:o.ph,court:o.court,a:o.a,b:o.b,ta:o.ta||null,tb:o.tb||null,bor:o.bor||{a:null,b:null},
    target:o.target||5,done:false,x:false,sa:null,sb:null,partial:false,t0:now(),t1:null,dbl:null,lider:null,card:null};
  S.matches.push(m);return m;
}
function startClock(){var k=S.phase;if(!S.clock[k])S.clock[k]=now();}

// ---------- individual scoring
function indivPts(m,id){
  var s=sideOf(m,id);if(!s||!m.done)return 0;
  var gm=s==='a'?m.sa:m.sb, ot=s==='a'?m.sb:m.sa, won=gm>ot, g=gm*factor(m);
  if((m.ph==='M'||m.ph==='R')&&extrasOn(m.ph)){
    if(isDbl(m,s)&&won)g*=2;
    if(m.lider&&won&&sideOf(m,m.lider)===other(s))g+=1;
  }
  return g;
}
function statMap(phs){
  var st={};S.players.forEach(function(p){st[p.id]={pj:0,g:0,pg:0,avg:0,dbl:0};});
  S.matches.forEach(function(m){
    if(!valid(m)||phs.indexOf(m.ph)<0||!m.done)return;
    m.a.concat(m.b).forEach(function(id){var r=st[id];if(!r)return;var s=sideOf(m,id);
      var gm=s==='a'?m.sa:m.sb, ot=s==='a'?m.sb:m.sa;
      r.pj++;r.g+=indivPts(m,id);if(gm>ot)r.pg++;if(isDbl(m,s)&&extrasOn(m.ph))r.dbl++;});
  });
  Object.keys(st).forEach(function(k){var r=st[k];r.g=Math.round(r.g*100)/100;r.avg=r.pj?r.g/r.pj:0;});
  return st;
}
function ranking(phs){
  var st=statMap(phs);
  return S.players.map(function(p){var r=st[p.id];return {id:p.id,name:p.name,rnd:p.rnd,out:p.out,pj:r.pj,g:r.g,pg:r.pg,avg:r.avg,dbl:r.dbl};})
    .sort(function(a,b){return b.avg-a.avg||b.pg-a.pg||a.rnd-b.rnd;});
}
function satRanking(){
  var rk=ranking(['M','T']);
  if(S.tb.ind){var i=rk.findIndex(function(r){return r.id===S.tb.ind;});if(i>0){var c=rk.splice(i,1)[0];rk.unshift(c);}}
  return rk;
}

// ---------- team scoring
function teamCalc(m){
  var fa=factor(m), A=(m.sa||0)*fa, B=(m.sb||0)*fa, notes=[];
  if(m.card&&extrasOn('T')){
    var own=m.card.side, k=m.card.k, ot=own==='a'?m.ta:m.tb, op=own==='a'?m.tb:m.ta;
    var won=own==='a'?m.sa>m.sb:m.sb>m.sa, TN=function(t){return TEAMS[t].name;};
    if(k==='turbo'){if(won){if(own==='a')A+=2;else B+=2;notes.push('🚀 Turbo: '+TN(ot)+' suma +2');}else notes.push('🚀 '+TN(ot)+' perdió: el Turbo no suma');}
    if(k==='robo'){if(won){var og=own==='a'?B:A, st=Math.min(2,og);if(own==='a'){A+=st;B-=st;}else{B+=st;A-=st;}
      notes.push(st?'🦹 '+TN(ot)+' le roba '+fmt(st)+' game'+(st===1?'':'s')+' a '+TN(op):'🦹 '+TN(op)+' no tenía games para robar');}
      else notes.push('🦹 '+TN(ot)+' perdió: el Robo no suma');}
  }
  return {a:A,b:B,notes:notes};
}
function rachaInfo(){
  var streak={azul:0,verde:0,naranja:0}, bonus={}, tot={azul:0,verde:0,naranja:0};
  if(!extrasOn('T'))return {streak:streak,bonus:bonus,tot:tot};
  S.matches.filter(function(m){return m.ph==='T'&&valid(m)&&m.done;}).sort(function(x,y){return (x.t1||0)-(y.t1||0)||x.id-y.id;})
    .forEach(function(m){if(m.sa===m.sb)return;var w=m.sa>m.sb?m.ta:m.tb, l=m.sa>m.sb?m.tb:m.ta;
      streak[w]++;streak[l]=0;if(streak[w]>=2){bonus[m.id]={t:w,s:streak[w]};tot[w]+=1;}});
  return {streak:streak,bonus:bonus,tot:tot};
}
function teamTotals(){
  var r={},ri=rachaInfo();TEAM_IDS.forEach(function(t){r[t]={t:t,arr:S.arrastre[t]||0,g:0,cards:0,racha:ri.tot[t],pg:0,pj:0,total:0,streak:ri.streak[t]};});
  S.matches.forEach(function(m){if(!valid(m)||m.ph!=='T'||!m.done)return;var c=teamCalc(m),fa=factor(m);
    r[m.ta].g+=m.sa*fa;r[m.tb].g+=m.sb*fa;r[m.ta].cards+=c.a-m.sa*fa;r[m.tb].cards+=c.b-m.sb*fa;r[m.ta].pj++;r[m.tb].pj++;
    if(m.sa>m.sb)r[m.ta].pg++;else if(m.sb>m.sa)r[m.tb].pg++;});
  TEAM_IDS.forEach(function(t){var x=r[t];x.total=Math.round((x.arr+x.g+x.cards+x.racha)*10)/10;});
  var list=TEAM_IDS.map(function(t){return r[t];}).sort(function(a,b){return b.total-a.total||b.pg-a.pg;});
  if(S.tb.team){var i=list.findIndex(function(x){return x.t===S.tb.team;});if(i>0){var c=list.splice(i,1)[0];list.unshift(c);}}
  return list;
}

// ---------- extras at draw time
function poolFor(ph){
  if(ph==='M')return S.players.filter(function(p){return !p.out;}).map(function(p){return p.id;});
  if(ph==='R')return S.players.filter(function(p){return !p.out&&S.sunday.final.indexOf(p.id)<0;}).map(function(p){return p.id;});
  return [];
}
function dblCount(id,ph){return S.matches.filter(function(m){return valid(m)&&m.ph===ph&&dblSides(m).some(function(s){return m[s].indexOf(id)>=0;});}).length;}
function assignDoble(m){
  if(!extrasOn(m.ph))return;
  var pool=poolFor(m.ph), need=pool.filter(function(id){return dblCount(id,m.ph)===0;});
  if(!need.length)return;
  var nA=m.a.filter(function(id){return need.indexOf(id)>=0;}), nB=m.b.filter(function(id){return need.indexOf(id)>=0;});
  var risk=function(ns){return ns.reduce(function(s,id){return s+(countPJ(id,[m.ph])>=1?10:3);},0);};
  var rA=risk(nA), rB=risk(nB);
  var best=rA>rB?'a':rB>rA?'b':(Math.random()<.5?'a':'b');
  var n=best==='a'?nA:nB;if(!n.length)return;
  var remAfter=planned(m.ph)-countCreated(m.ph);
  var cap=Math.ceil(4*planned(m.ph)/pool.length);
  var others=need.filter(function(id){return !has(m,id);}).length;
  var urgent=n.some(function(id){return countPJ(id,[m.ph])>=(NC()===3?3:1);})||need.length>2*remAfter||others>2*remAfter;
  if(n.length===2||urgent){m.dbl=best;
    var on=best==='a'?nB:nA;
    if(remAfter<=(NC()===3?3:3)&&on.some(function(id){return countPJ(id,[m.ph])>=1;}))m.dbl='ab';
  }
}
function assignLider(m){
  if(!extrasOn(m.ph)||countDone(m.ph)<2)return;
  var pool=poolFor(m.ph), rk=ranking([m.ph]).filter(function(r){return r.pj>0&&pool.indexOf(r.id)>=0;});
  if(rk.length&&has(m,rk[0].id))m.lider=rk[0].id;
}
function currentLeader(ph){if(!extrasOn(ph)||countDone(ph)<2)return null;var pool=poolFor(ph);var rk=ranking([ph]).filter(function(r){return r.pj>0&&pool.indexOf(r.id)>=0;});return rk.length?rk[0].id:null;}
function makeCardPlan(){
  var deck={};TEAM_IDS.forEach(function(t){deck[t]=shuffle([pick(['sinsegundo','mano']),pick(['turbo','robo']),pick(['arriba','abajo'])]);});
  var k=planned('T')/3, a,b,c,d,e,f, tries=0;
  do{a=Math.floor(Math.random()*4);b=Math.floor(Math.random()*4);d=Math.floor(Math.random()*4);c=3-a;e=3-b;f=3-d;tries++;}
  while(tries<500&&!(a+b<=k&&c+d<=k&&e+f<=k&&e>=0&&f>=0));
  var mk=function(t1,n1,t2,n2){var arr=[];for(var i=0;i<k;i++)arr.push(i<n1?t1:(i<n1+n2?t2:null));return shuffle(arr);};
  S.cardPlan={deck:deck,owners:{'azul-verde':mk('azul',a,'verde',b),'azul-naranja':mk('azul',c,'naranja',d),'naranja-verde':mk('verde',e,'naranja',f)}};
}
function ckey(a,b){return [a,b].sort().join('-');}
function cardsUsed(team,exceptId){return S.matches.filter(function(m){return m.ph==='T'&&valid(m)&&m.id!==exceptId&&m.card&&(m.card.side==='a'?m.ta:m.tb)===team;}).length;}
function assignCard(m){
  if(!S.cardPlan)return;
  var k=ckey(m.ta,m.tb), n=S.matches.filter(function(x){return x.ph==='T'&&valid(x)&&x.id!==m.id&&ckey(x.ta,x.tb)===k;}).length;
  var owner=S.cardPlan.owners[k][n];if(!owner)return;
  var idx=cardsUsed(owner,m.id), card=S.cardPlan.deck[owner][idx];if(!card)return;
  m.card={side:owner===m.ta?'a':'b',k:card};
}

// ---------- draws
function drawMorning(court,excl,ph){
  ph=ph||'M';
  var busy=onCourt(), pool=poolFor(ph);
  var free=pool.filter(function(id){return !busy.has(id)&&excl.indexOf(id)<0;});
  if(free.length<4){toast('No hay 4 jugadoras libres');return false;}
  var cap=Math.ceil(4*planned(ph)/pool.length);
  var need=extrasOn(ph)?new Set(pool.filter(function(id){return dblCount(id,ph)===0;})):null;
  var ord=prioritySort(free,[ph]), cand=ord.slice(0,Math.min(ord.length,8));
  var minpj=Math.min.apply(null,cand.map(function(id){return countPJ(id,[ph]);}));
  var phm=S.matches.filter(function(x){return x.ph===ph&&valid(x);});
  var waited=function(id){var c=0;for(var q=phm.length-1;q>=0;q--){if(has(phm[q],id))break;c++;}return c;};
  var must=cand.filter(function(id){return waited(id)>=2*NC()&&countPJ(id,[ph])<cap;});
  var info={};cand.forEach(function(id,i){var pj=countPJ(id,[ph]);info[id]=(pj-minpj)*(NC()===3?1500:1000)+(pj>=cap?5000:0)+(jf(id)?150:0)+i*10;});
  var best=null,bc=1e9;
  for(var i=0;i<cand.length;i++)for(var j=i+1;j<cand.length;j++)for(var k=j+1;k<cand.length;k++)for(var l=k+1;l<cand.length;l++){
    var f=[cand[i],cand[j],cand[k],cand[l]];
    if(must.length&&must.slice(0,4).some(function(id){return f.indexOf(id)<0;}))continue;
    var base=info[f[0]]+info[f[1]]+info[f[2]]+info[f[3]];
    if(base>=bc+120)continue;var sp=bestSplit(f,need), c=base+sp.cost;
    if(c<bc){bc=c;best=sp;}
  }
  if(bc>=5000&&live().length&&!FORCE){WAIT=true;return false;}
  var m=addMatch({ph:ph,court:court,a:best.a,b:best.b,target:target()});
  assignDoble(m);assignLider(m);
  return true;
}
function crucesRemaining(){
  var used={};
  S.matches.forEach(function(m){if(m.ph==='T'&&valid(m)){var k=ckey(m.ta,m.tb);used[k]=(used[k]||0)+1;}});
  var rem=[];[['azul','verde'],['azul','naranja'],['verde','naranja']].forEach(function(c){var k=ckey(c[0],c[1]);for(var i=(used[k]||0);i<planned('T')/3;i++)rem.push(i%2?[c[1],c[0]]:c);});
  return rem;
}
function borrowCount(team){return S.matches.filter(function(m){return m.ph==='T'&&valid(m)&&((m.ta===team&&m.bor.a)||(m.tb===team&&m.bor.b));}).length;}
function pickPair(team,opp,busy,strict,excl){
  var members=S.teams[team];
  var ok=function(id){var p=P(id);return p&&!p.out&&!busy.has(id)&&excl.indexOf(id)<0&&!(strict&&jf(id));};
  var items=members.filter(ok).map(function(id){return {id:id,pj:countPJ(id,['T']),jf:jf(id)?1:0,le:lastEnd(id),bor:false};});
  var outs=members.filter(function(id){return P(id).out;});
  if(S.settings.lesion==='prestada'&&outs.length){
    var third=TEAM_IDS.filter(function(t){return t!==team&&t!==opp;})[0];
    var pool=S.teams[third].filter(ok);
    if(pool.length){
      var vpj=(outs.reduce(function(s,id){return s+countPJ(id,['T']);},0)+borrowCount(team))/outs.length;
      var lend=shuffle(pool).sort(function(x,y){return countPJ(x,['M','T'])-countPJ(y,['M','T'])||lastEnd(x)-lastEnd(y);})[0];
      items.push({id:lend,pj:vpj,jf:0,le:0,bor:true});
    }
  }
  if(items.length<2)return null;
  items=shuffle(items).sort(function(x,y){return x.pj-y.pj||x.jf-y.jf||x.le-y.le;});
  var top=items.slice(0,5),out=[];
  for(var i=0;i<top.length;i++)for(var j=i+1;j<top.length;j++){
    if(top[i].bor&&top[j].bor)continue;
    out.push({pair:[top[i].id,top[j].id],borrowed:top[i].bor?top[i].id:(top[j].bor?top[j].id:null),
      pc:(top[i].bor||top[j].bor)?0:partnerCount(top[i].id,top[j].id),jf:top[i].jf+top[j].jf,ord:i+j});
  }
  return out.length?out:null;
}
var FORCE=false, WAIT=false;
function drawAfternoon(court,excl){
  var rem=crucesRemaining();
  if(S.afternoonCut||!rem.length){toast('Ya se sortearon todos los cruces');return false;}
  var busy=onCourt(), best=null, bc=1e9, perTeam=2*planned('T')/3;
  var minPJ=function(t){var v=S.teams[t].filter(function(id){return !P(id).out;}).map(function(id){return countPJ(id,['T']);});return v.length?Math.min.apply(null,v):0;};
  var excess=function(t,pair,bor){return pair.reduce(function(s,id){return s+(id===bor?0:countPJ(id,['T'])-minPJ(t));},0);};
  var viol=function(t,pair){var act=S.teams[t].filter(function(id){return !P(id).out;});if(act.length!==5)return 0;
    var tot=2*perTeam, base=Math.floor(tot/5), extra=tot-base*5;
    var c=act.map(function(id){return countPJ(id,['T'])+(pair.indexOf(id)>=0?1:0);});
    return (c.some(function(v){return v>base+1;})||c.filter(function(v){return v===base+1;}).length>extra)?1:0;};
  var seen={};
  for(var k=0;k<2;k++){var strict=k===0;
    for(var i=0;i<rem.length;i++){var t1=rem[i][0],t2=rem[i][1],sk=ckey(t1,t2)+strict;if(seen[sk])continue;seen[sk]=1;
      var AL=pickPair(t1,t2,busy,strict,excl);if(!AL)continue;
      var BL=pickPair(t2,t1,busy,strict,excl);if(!BL)continue;
      AL.forEach(function(A){BL.forEach(function(B){
        if(A.pair.some(function(id){return B.pair.indexOf(id)>=0;}))return;
        var cost=(viol(t1,A.pair)+viol(t2,B.pair))*1000+(strict?0:50)+(excess(t1,A.pair,A.borrowed)+excess(t2,B.pair,B.borrowed))*40+(A.pc+B.pc)*120+(A.jf+B.jf)*4+(A.ord+B.ord)*0.5+i*0.1+Math.random()*0.01;
        if(cost<bc){bc=cost;best={t1:t1,t2:t2,A:A,B:B};}
      });});
    }
  }
  if(best&&bc>=1000&&live().length&&!FORCE){WAIT=true;return false;}
  if(best){var m=addMatch({ph:'T',court:court,ta:best.t1,tb:best.t2,a:best.A.pair,b:best.B.pair,bor:{a:best.A.borrowed,b:best.B.borrowed},target:target()});assignCard(m);return true;}
  toast('No hay jugadoras libres para ningún cruce. Esperá a que termine la otra cancha.');
  return false;
}
function drawFinal(court){
  var idx=countCreated('F');var f=S.sunday.final;var sp=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]][idx];
  var busy=onCourt();if(f.some(function(id){return busy.has(id);}))return false;
  addMatch({ph:'F',court:court,a:sp[0].map(function(i){return f[i];}),b:sp[1].map(function(i){return f[i];}),target:target()});
  return true;
}
function drawSunday(court,excl){
  var fLeft=countCreated('F')<FINAL_N, rLeft=countCreated('R')<REV_N();
  if(court===1&&fLeft&&drawFinal(1))return true;
  if(rLeft)return drawMorning(court,excl,'R');
  if(fLeft&&drawFinal(court))return true;
  toast('Esperá a que termine la otra cancha');return false;
}
function drawFor(court,excl){
  excl=excl||[];var ok=false;
  if(S.phase==='morning')ok=drawMorning(court,excl,'M');
  else if(S.phase==='afternoon')ok=drawAfternoon(court,excl);
  else if(S.phase==='sunday')ok=drawSunday(court,excl);
  if(ok)startClock();
  return ok;
}
function canDraw(c){
  if(S.phase==='morning'){if(S.morningCut)return {ok:false,msg:'Mañana cerrada ✋'};
    if(countCreated('M')>=planned('M'))return {ok:false,msg:'¡Ya salieron todos los partidos de la mañana! 🎉'};return {ok:true};}
  if(S.phase==='afternoon'){if(S.afternoonCut)return {ok:false,msg:'Tarde cerrada ✋'};
    if(!crucesRemaining().length)return {ok:false,msg:'¡Ya salieron todos los cruces! 🎉'};return {ok:true};}
  if(S.phase==='sunday'){var f=countCreated('F')<FINAL_N, r=countCreated('R')<REV_N();
    if(f||r)return {ok:true};return {ok:false,msg:'¡Domingo completo! 🏆'};}
  return {ok:false,msg:''};
}
function drawTeams(){
  if(S.players.length!==15){toast('Se necesitan 15 jugadoras');return false;}
  var rk=ranking(['M']), st=statMap(['M']);
  var teams={azul:[],verde:[],naranja:[]}, leaders={}, bombos=[];
  for(var b=0;b<5;b++){var bo=rk.slice(b*3,b*3+3).map(function(r){return r.id;});bombos.push(bo);
    var order=shuffle(TEAM_IDS);bo.forEach(function(id,i){teams[order[i]].push(id);if(b===0)leaders[order[i]]=id;});}
  var arr={};TEAM_IDS.forEach(function(t){arr[t]=Math.round(teams[t].reduce(function(s,id){return s+st[id].avg;},0)*10)/10;});
  S.teams=teams;S.leaders=leaders;S.arrastre=arr;S.bombos=bombos;
  return true;
}
function teamCreatedCounts(){var c={azul:0,verde:0,naranja:0};S.matches.forEach(function(m){if(m.ph==='T'&&valid(m)){c[m.ta]++;c[m.tb]++;}});return c;}

// ---------- time estimate
function avgDur(phs){
  var d=S.matches.filter(function(m){return phs.indexOf(m.ph)>=0&&m.done&&valid(m)&&m.t1&&!m.partial;}).sort(function(a,b){return b.t1-a.t1;}).slice(0,6)
    .map(function(m){return (m.t1-m.t0)/60000*(5/(m.target||5));});
  var base=d.length>=2?d.reduce(function(s,x){return s+x;},0)/d.length:DEF_DUR;
  return Math.max(12,base)*(target()/5);
}
function estimate(){
  var phs=phOfPhase();if(!phs.length||!S.clock[S.phase])return null;
  var avg=avgDur(phs), t=now();
  var courts=COURTS().map(function(c){var m=courtMatch(c);return m?Math.max(m.t0+avg*60000,t+3*60000):t;});
  var rem=0;phs.forEach(function(ph){rem+=Math.max(0,planned(ph)-countCreated(ph));});
  if(S.phase==='morning'&&S.morningCut)rem=0;if(S.phase==='afternoon'&&S.afternoonCut)rem=0;
  for(var i=0;i<rem;i++){courts.sort(function(a,b){return a-b;});courts[0]+=avg*60000;}
  var end=Math.max.apply(null,courts), start=S.clock[S.phase], max=(S.phase==='sunday'?SUN_MAX:S.settings.maxMin)*60000;
  return {start:start,end:end,limit:start+max,avg:avg,elapsed:(t-start)/60000,rem:rem,oneMore:Math.min.apply(null,courts)+avg*60000};
}

function validate(m){
  if(R.sa==null||R.sb==null)return 'Elegí los games de las dos parejas';
  if(R.partial)return '';

    if(m.card.k==='arriba'&&(s==='a'?R.sa:R.sb)<1)return 'Arrancaron 1-0 arriba: esa pareja tiene al menos 1 game.';
    if(m.card.k==='abajo'&&(s==='a'?R.sb:R.sa)<1)return 'Arrancaron 0-1 abajo: el rival tiene al menos 1 game.';}
  return '';
}

A.result=function(a){openResult(a);};
A.rs=function(a){var p=a.split(':'),s=p[0],v=+p[1],m=getM(R.id),T=m.target;
  if(s==='a'){R.sa=v;if(!R.partial&&v<T&&R.sb==null)R.sb=T;}else{R.sb=v;if(!R.partial&&v<T&&R.sa==null)R.sa=T;}
  if(!R.partial&&v===T){if(s==='a'&&R.sb===T)R.sb=null;if(s==='b'&&R.sa===T)R.sa=null;}
  renderResult();};
A.rpart=function(){R.partial=!R.partial;renderResult();};
A.rsave=function(){var m=getM(R.id);if(validate(m))return;var was;
  commit(function(){was=applyResult(m,R.sa,R.sb,{partial:R.partial});});
  closeModal();
  if(m.ph==='T')showReveal(m);
  else{var n=morningNote(m);toast((was?'✏️ Resultado corregido':'✅ ¡Guardado!')+(n?' '+n:''));}
};
A.cancel=function(a){ask('✖️ Cancelar partido','Las jugadoras vuelven a la fila.','Sí, cancelar','p',function(){commit(function(){getM(a).x=true;});});};
A['void']=function(a){ask('🗑️ Anular partido','Se borra del ranking y de la tabla de equipos.','Sí, anular','p',function(){commit(function(){getM(a).x=true;});toast('🗑️ Partido anulado');});};
A.reroll=function(a){openReroll(a);};
A.rrx=function(a){var i=RR.ex.indexOf(a);if(i>=0)RR.ex.splice(i,1);else RR.ex.push(a);renderReroll();};
A.rrgo=function(){var id=RR.id,ex=RR.ex.slice();closeModal();FORCE=true;
  var ok=tryCommit(function(){var m=getM(id);m.x=true;return drawFor(m.court,ex);});FORCE=false;if(ok)toast('🎲 ¡Nuevo sorteo!');};
A.extraM=function(){commit(function(){S.extraM=(S.extraM||0)+1;});toast('➕ Sorteá el partido extra en la cancha libre');};
A.toMidday=function(){commit(function(){S.phase='midday';S.settings.emergency=false;});window.scrollTo(0,0);};
A.drawTeams=function(){if(tryCommit(drawTeams)){confetti();window.scrollTo(0,0);}};
A.toAfternoon=function(){commit(function(){S.aftN=AFT_N();makeCardPlan();S.phase='afternoon';S.settings.emergency=false;});toast('🌇 ¡Arranca la tarde!');window.scrollTo(0,0);};
A.toClosed=function(){commit(function(){S.phase='closed';S.settings.emergency=false;});confetti();window.scrollTo(0,0);};
A.toSunday=function(){
  modal('<h2>🌞 Domingo</h2><p>Juegan la <b>Gran Final</b> las 4 primeras del sábado (3 partidos, cancha 1). El resto juega la <b>Copa Revancha</b>. Son unas 2 horas.</p><p class="muted">La Gran Final se juega siempre sin extras.</p>'+
    '<button class="btn o big" data-act="sunGo" data-arg="1">🃏 Revancha con extras (doble y líder)</button><button class="btn w" data-act="sunGo" data-arg="0">Revancha sin extras</button><button class="btn w sm" data-act="close">Cancelar</button>');};
A.sunGo=function(a){closeModal();commit(function(){S.sunday={final:satRanking().slice(0,4).map(function(r){return r.id;}),extras:a==='1'};S.phase='sunday';S.settings.emergency=false;TAB='canchas';});window.scrollTo(0,0);toast('🌞 ¡Arranca el domingo!');};
A.tie=function(a){openTie(a);};
A.tieTb=function(){modal('<h2>🎾 Tiebreak a 10</h2><p>Que lo jueguen y tocá a la ganadora.</p>'+TIE.c.map(function(x){return '<button class="btn y" data-act="tieWin" data-arg="'+x.id+'">🏆 Ganó '+esc(x.label)+'</button>';}).join('')+'<button class="btn w sm" data-act="close">Cancelar</button>');};
A.tieWin=function(a){setTie(a);};
A.tieRnd=function(){var c=TIE.c,i=0;modal('<h2>🎲 Sorteando…</h2><div class="roul" id="roul">…</div>');
  var iv=setInterval(function(){var el=$('#roul');if(el)el.textContent=c[i++%c.length].label;},90);
  setTimeout(function(){clearInterval(iv);var w=c[Math.floor(Math.random()*c.length)];var el=$('#roul');if(el)el.textContent='🏆 '+w.label;setTimeout(function(){setTie(w.id);},1200);},2200);};
A.tgCards=function(){commit(function(){S.settings.cards=!S.settings.cards;});toast(S.settings.cards?'🃏 Con cartas':'Torneo tradicional, sin cartas');};
A.tgCourts=function(){if(!canChangeCourts())return toast('Se cambia entre tandas');commit(function(){S.settings.courts=NC()===3?2:3;});toast('🎾 '+NC()+' canchas');};
A.tgDur=function(){commit(function(){var i=DURS.indexOf(S.settings.maxMin);S.settings.maxMin=DURS[(i+1)%DURS.length];});};
A.tgEmerg=function(){commit(function(){S.settings.emergency=!S.settings.emergency;});toast(S.settings.emergency?'⚡ Los próximos partidos van a 3 games':'Partidos a 5 games');};
A.tgLesion=function(){commit(function(){S.settings.lesion=S.settings.lesion==='4'?'prestada':'4';});};
A.tgOut=function(a){commit(function(){var p=P(a);p.out=!p.out;});};
A.rename=function(a){var p=P(a);modal('<h2>✏️ Cambiar nombre</h2><textarea id="rnm" rows="1">'+esc(p.name)+'</textarea><button class="btn big mt" data-act="rnmok" data-arg="'+a+'">Guardar</button><button class="btn w sm" data-act="close">Cancelar</button>');};
A.rnmok=function(a){var n=($('#rnm').value||'').trim();if(!n)return toast('Escribí un nombre');var p=P(a);closeModal();commit(function(){p.name=n;});};
A.cutMorning=function(){ask('✋ Cerrar la mañana','No se sortean más partidos. Los que están en juego se terminan y después pasás al sorteo de equipos. El ranking va por promedio, así que sigue siendo justo.','Sí, cerrar','p',function(){commit(function(){S.morningCut=true;});});};
A.cutAfternoon=function(){
  if(!teamsEven()){var c=teamCreatedCounts();return modal('<h2>✋ Todavía no</h2><p>Para que sea justo, la tarde se puede cortar cuando los 3 equipos jugaron la misma cantidad de partidos.</p><p><b>Ahora:</b> '+TEAM_IDS.map(function(t){return TEAMS[t].emoji+' '+c[t];}).join(' · ')+'</p><p class="muted">Si vienen atrasadas, mejor el modo emergencia a 3 games.</p><button class="btn w" data-act="close">Entendido</button>');}
  ask('✋ Terminar la tarde','No se sortean más partidos. Los 3 equipos quedan con los mismos partidos.','Sí, terminar','p',function(){commit(function(){S.afternoonCut=true;});});};
A.share=doShare;
A['export']=doExport;
A['import']=openImport;
A.impgo=function(){try{var s=JSON.parse($('#impt').value);if(!s||!s.players||!s.matches||s.v!==2)throw 0;ask('📥 Importar','Esto reemplaza todo lo que hay ahora por el respaldo.','Sí, importar','b',function(){commit(function(){S=s;});toast('📥 Respaldo cargado');});}catch(e){toast('Ese respaldo no es válido');}};
A.reset=function(){ask('🧨 Volver a empezar','Se borra todo el torneo: jugadoras, partidos, equipos y ranking. <b>No se puede deshacer.</b> Si querés, antes exportá un respaldo.','Sí, borrar todo','p',function(){S=newState();hist=[];SETUP_DRAFT='';persist();TAB='canchas';render();window.scrollTo(0,0);toast('🧨 Torneo reiniciado');});};

document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el||el.disabled)return;var f=A[el.dataset.act];if(f)f(el.dataset.arg,el,e);});
setInterval(function(){if(!$('#modal-root').innerHTML&&TAB==='canchas'&&S.phase!=='setup')render();},30000);
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){});}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
window.__T={get S(){return S;},set S(v){S=v;},drawFor:drawFor,drawTeams:drawTeams,applyResult:applyResult,ranking:ranking,teamTotals:teamTotals,crucesRemaining:crucesRemaining,live:live,countPJ:countPJ,partnerCount:partnerCount,teamCalc:teamCalc,rachaInfo:rachaInfo,render:render,canDraw:canDraw,makeCardPlan:makeCardPlan,estimate:estimate,statMap:statMap,dblCount:dblCount,planned:planned};
render();
})();

</script>
</body>
</html>
